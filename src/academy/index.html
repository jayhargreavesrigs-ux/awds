<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AWDS Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed header, course map rail on the left, one slide or test at a time on the right.
   Colours and faces follow the AWDS Module 1 decks (navy/steel blue with an amber signal; Cambria/Calibri metrics via Caladea/Carlito). */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --raise:#EEF2F7; --ink:#18222E; --muted:#5E6C7A; --line:#DCE3EC;
  --navy:#14324F; --blue:#2E5C8A; --sky:#5B8AB8; --amber:#C86A14; --amber-soft:#FBEEDF;
  --good:#2D7A4B; --good-soft:#E3F2E8; --bad:#B1372B; --bad-soft:#F8E4E1;
  --mud:#C9D7E6; --steel:#7D8B99; --hdr:#12283C; --hdr-ink:#F4F6F9;
  --sky-bg:#EEF3F9; --rock1:#E4DED3; --rock2:#D6CDBE; --res:#CDBF9F; --oil:#4A3B22; --water:#BCD6EC; --mudc:#8A6E4B; --cement:#B4B9BF; --skin:#E0A878; --gas:#F4F6F9;
  --f-display:"Caladea",Cambria,Georgia,serif; --f-body:"Carlito",Calibri,"Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono","Courier New",ui-monospace,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1724; --surface:#12283C; --raise:#18324A; --ink:#E6ECF3; --muted:#9DAABA; --line:#25405A;
  --navy:#DCE7F3; --blue:#86AEDA; --sky:#5B8AB8; --amber:#E8913F; --amber-soft:#3A2A18;
  --good:#5DBB82; --good-soft:#173726; --bad:#F07A6C; --bad-soft:#3D1D1A;
  --mud:#27496B; --steel:#8FA0B2; --hdr:#07111B; --hdr-ink:#E6ECF3; --sky-bg:#0F2133; --rock1:#2A2722; --rock2:#332F28; --res:#3E3424; --oil:#C49A52; --water:#1F4A6E; --mudc:#7A5E3D; --cement:#5D646C; --skin:#C88E60; --gas:#E6ECF3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1724; --surface:#12283C; --raise:#18324A; --ink:#E6ECF3; --muted:#9DAABA; --line:#25405A;
  --navy:#DCE7F3; --blue:#86AEDA; --sky:#5B8AB8; --amber:#E8913F; --amber-soft:#3A2A18;
  --good:#5DBB82; --good-soft:#173726; --bad:#F07A6C; --bad-soft:#3D1D1A;
  --mud:#27496B; --steel:#8FA0B2; --hdr:#07111B; --hdr-ink:#E6ECF3; --sky-bg:#0F2133; --rock1:#2A2722; --rock2:#332F28; --res:#3E3424; --oil:#C49A52; --water:#1F4A6E; --mudc:#7A5E3D; --cement:#5D646C; --skin:#C88E60; --gas:#E6ECF3; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.88em}
h1,h2,h3{font-family:var(--f-display);color:var(--navy);text-wrap:balance;margin:0;line-height:1.2}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);color:var(--hdr-ink);display:flex;align-items:center;gap:16px;padding:10px 16px;min-height:56px}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-family:var(--f-display);font-size:18px;letter-spacing:.06em}
.brand span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1}
.meter{display:flex;align-items:center;gap:8px;font-size:13px}
.meter .bar{width:120px;height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--amber)}
.who{font-size:13px;opacity:.85;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.3);color:var(--hdr-ink);border-radius:var(--r);padding:6px 10px;font-size:13px;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.08)}
#menuBtn{display:none}

/* shell */
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100% - 56px)}
#map{border-right:1px solid var(--line);background:var(--surface);padding:16px 0 32px;overflow-y:auto;position:sticky;top:56px;height:calc(100vh - 56px)}
#main{padding:24px 32px 48px;min-width:0}
.map-block{padding:0 16px 8px}
.map-block summary{cursor:pointer;list-style:none;display:block;padding:4px 0 8px}.map-block summary::-webkit-details-marker{display:none}.map-block summary small{color:var(--muted);font-size:12px;display:block;margin-left:14px}.map-block summary h3::before{content:'▸ ';}.map-block[open] summary h3::before{content:'▾ ';}.map-block summary h3{margin:4px 0!important}
.map-block h3{font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-family:var(--f-body);margin:8px 0}
.map-week{margin:6px 0 12px}
.map-week>div{font-weight:700;font-size:14px;color:var(--navy);padding:4px 0}
.map-week>div small{font-weight:400;color:var(--muted)}
.unit-link{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:var(--r);padding:7px 8px;cursor:pointer;font-size:14px;line-height:1.3}
.unit-link:hover{background:var(--raise)}
.unit-link.active{background:var(--raise);box-shadow:inset 3px 0 0 var(--amber)}
.unit-link.locked{color:var(--muted);cursor:not-allowed}
.st{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:1px;display:grid;place-items:center}
.st.done{background:var(--good);border-color:var(--good)}
.st.done::after{content:"";width:5px;height:9px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.st.open{border-color:var(--amber)}
.st.open::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber)}
.st.lock{border-radius:3px;border-width:0;background:var(--line);height:12px;margin-top:5px;position:relative}
.st.lock::before{content:"";position:absolute;width:8px;height:7px;border:2px solid var(--line);border-bottom:0;border-radius:5px 5px 0 0;top:-7px;left:3px}
.unit-link .tag{display:block;font-size:12px;color:var(--muted)}
.unit-link.test .t-name{font-weight:700}

/* common */
.crumb{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r);padding:10px 18px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--sky)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--raise);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.amb{background:var(--amber-soft);color:var(--amber)}
.banner{border:1px solid var(--line);background:var(--raise);border-radius:var(--r);padding:10px 14px;font-size:14px;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--hdr);color:var(--hdr-ink);padding:10px 16px;border-radius:var(--r);font-size:14px;z-index:50;max-width:calc(100% - 32px)}

/* home */
.home h1{font-size:34px;margin:4px 0 8px}
.home .intro{max-width:66ch;color:var(--muted)}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:24px 0}.steps3.four{grid-template-columns:repeat(4,minmax(0,1fr))}.qpic{max-width:260px;margin-top:8px}
@media (max-width:1100px){.steps3.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.steps3>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.steps3 b{display:block;font-family:var(--f-display);font-size:19px;color:var(--navy);margin-bottom:4px}
.steps3 p{margin:0;font-size:15px;color:var(--muted)}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:16px}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.wk .n{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wk b{font-family:var(--f-display);font-size:18px;color:var(--navy);line-height:1.2}
.wk .prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:auto}
.wk .prog i{display:block;height:100%;background:var(--good)}
.wk .meta{font-size:13px;color:var(--muted)}
.later{opacity:.6}

/* slide */
.stage{max-width:1000px}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 32px 24px;min-height:440px;display:flex;flex-direction:column;gap:14px}
.slide .kick{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);font-weight:700}
.slide h2{font-size:28px}
.slide .body{display:flex;flex-direction:column;gap:14px;min-width:0}
.slide .body p{margin:0;max-width:72ch}
.lead{font-size:19px;color:var(--ink)}
.formula{font-family:var(--f-mono);background:var(--raise);border-left:3px solid var(--blue);padding:12px 16px;display:flex;flex-direction:column;gap:4px;font-size:15px;overflow-x:auto}
.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:10px;align-items:baseline}
.steps li::before{content:counter(s);grid-row:span 2;width:24px;height:24px;border-radius:50%;background:var(--navy);color:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:700}
.steps li b{font-size:15px}
.steps li span{color:var(--muted)}
.steps li span.mono{color:var(--ink)}
.note{border:1px solid var(--line);background:var(--raise);border-radius:var(--r);padding:12px 14px;font-size:15px}
.note b{display:block;color:var(--blue);margin-bottom:2px}
.note.warn{background:var(--amber-soft);border-color:transparent}
.note.warn b{color:var(--amber)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.cols.wide-left{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.cols>div{min-width:0;display:flex;flex-direction:column;gap:12px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.trio>div{border-top:3px solid var(--blue);background:var(--raise);padding:12px;border-radius:0 0 var(--r) var(--r);display:flex;flex-direction:column;gap:4px;min-width:0}
.trio p{font-size:14px;color:var(--muted)}
.trio .big{font-size:26px;color:var(--navy);font-weight:500}
.answer{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.answer.good{border-color:var(--good);background:var(--good-soft)}.answer.bad{border-color:var(--bad);background:var(--bad-soft)}
.answer.good b{color:var(--good)}.answer.bad b{color:var(--bad)}
ul.plain,ul.check{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ul.check{list-style:none;padding-left:0}
ul.check li{padding-left:26px;position:relative}
ul.check li::before{content:"";position:absolute;left:2px;top:4px;width:14px;height:14px;border:2px solid var(--blue);border-radius:3px}
.src{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:auto!important}
.table-wrap{overflow-x:auto}
table.data{border-collapse:collapse;font-size:15px;min-width:100%}
table.data th{text-align:left;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--line);padding:6px 10px}
table.data td{border-bottom:1px solid var(--line);padding:6px 10px;vertical-align:top}
table.data.num td{font-variant-numeric:tabular-nums}
table.data tr.tot td{font-weight:700;color:var(--navy)}
.dg-fig{margin:0;display:flex;justify-content:center}
.dg{width:100%;max-width:240px;height:auto}
.dg .ln{stroke:var(--ink);stroke-width:1.5;fill:none}
.dg .thick{stroke-width:4}
.dg .dash{stroke-dasharray:5 4}
.dg .well{stroke:var(--amber);stroke-width:3}
.dg .acc-ln{stroke:var(--amber)}
.dg .fill-mud{fill:var(--mud)}
.dg .fill-steel{fill:var(--steel)}
.dg .t{fill:var(--ink);font:13px var(--f-body)}
.dg .t.b{font-weight:700;font-size:15px}
.dg .t.inv{fill:var(--navy);font-weight:700}
.dg .t.acc{fill:var(--amber);font-weight:700}
.dg .pore{stroke:var(--blue);stroke-width:2.5}.dg .frac{stroke:var(--bad);stroke-width:2.5}.dg .mud{stroke:var(--amber);stroke-width:2.5}
.dg .pore-t{fill:var(--blue);font-weight:700}.dg .frac-t{fill:var(--bad);font-weight:700}.dg .mud-t{fill:var(--amber);font-weight:700}
.dg .arrow{marker-end:none}
.tally{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0;font-family:var(--f-mono);font-size:14px}
.tally span{white-space:nowrap}
.tally i{font-style:normal;color:var(--muted);font-size:11px;margin-right:4px}
.navbar{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dots button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.dots button.seen{background:var(--sky)}
.dots button.on{background:var(--amber);transform:scale(1.3)}
.slide-meta{font-size:13px;color:var(--muted);margin-top:10px}

/* test */
.test-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.qs{display:flex;flex-direction:column;gap:12px;max-width:860px;counter-reset:q}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:32px minmax(0,1fr);gap:4px 12px}
.q .qn{font-family:var(--f-display);font-size:20px;color:var(--muted)}
.q .qt{min-width:0}
.q .ans{grid-column:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.q input[type=text]{font:16px var(--f-mono);padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);width:180px;max-width:100%}
.q .unit{color:var(--muted);font-size:15px}
.opts{grid-column:2;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.opts label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;cursor:pointer;font-size:15px}
.opts label:hover{border-color:var(--sky)}
.opts input{margin-top:4px}
.q.ok{border-color:var(--good)}.q.no{border-color:var(--bad)}
.fb{grid-column:2;font-size:14px;margin-top:8px;padding:8px 10px;border-radius:var(--r)}
.q.ok .fb{background:var(--good-soft)}.q.no .fb{background:var(--bad-soft)}
.fb b{display:block}
.submit-bar{position:sticky;bottom:0;background:var(--bg);padding:12px 0;border-top:1px solid var(--line);margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:860px}
.score{display:flex;gap:24px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;margin-bottom:16px;max-width:860px}
.score .pct{font-family:var(--f-display);font-size:56px;line-height:1;color:var(--navy)}
.score.pass{border-color:var(--good)}.score.fail{border-color:var(--bad)}

/* dashboard */
.dash table{min-width:760px}
.dash td small{display:block;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px;color:var(--muted);max-width:640px}


/* visual layer */
.fx-svg{width:100%;height:auto;display:block;border-radius:var(--r)}
.fx-svg .sky{fill:var(--sky-bg)}.fx-svg .rock1{fill:var(--rock1)}.fx-svg .rock2{fill:var(--rock2)}.fx-svg .res{fill:var(--res);transition:filter .6s}
.fx-svg .res.glow{filter:saturate(1.6) brightness(1.05)}
.fx-svg .oil{fill:var(--oil)}.fx-svg .holebg{fill:var(--mud);opacity:.55}.fx-svg .cement{fill:var(--cement)}
.fx-svg .mudfill{fill:var(--mudc);transition:fill .6s,opacity .3s}.fx-svg .mudfill.heavy{fill:var(--navy);opacity:.8}.fx-svg .mudfill.cut{opacity:.45}
.fx-svg .water{fill:var(--water);transition:fill .8s,transform 1s}.fx-svg .water.heavy{fill:var(--mudc)}
.fx-svg .casing{stroke:var(--steel);stroke-width:5}.fx-svg .lat{stroke:var(--steel);stroke-width:3}.fx-svg .lat.thin{stroke-width:1.5}
.fx-svg .steel{fill:var(--steel)}.fx-svg .steel-d{fill:var(--navy)}.fx-svg .wire{stroke:var(--ink);stroke-width:1.5}
.fx-svg .block{fill:var(--amber)}.fx-svg .bit{fill:var(--amber)}.fx-svg .equip{fill:var(--blue)}.fx-svg .equip-d{fill:var(--navy)}
.fx-svg .pit{fill:var(--mudc)}.fx-svg .bop{fill:var(--bad)}.fx-svg .bopl{stroke:var(--surface);stroke-width:1.5}
.fx-svg .ram{fill:var(--surface);transition:transform .8s}
.fx-svg .bop.pulse{animation:pulse 1.2s ease-in-out 3}
.fx-svg .ln{stroke:var(--ink);stroke-width:1.5;fill:none}.fx-svg .ln.dash{stroke-dasharray:6 5}.fx-svg .ln.ghost{stroke:var(--muted);stroke-dasharray:4 4}
.fx-svg .lead{stroke:var(--muted);stroke-width:1}
.fx-svg .t{fill:var(--ink);font:15px var(--f-body)}.fx-svg .t.b{font-weight:700}.fx-svg .t.sm{font-size:11px}.fx-svg .t.big{font-size:17px}
.fx-svg .t.inv{fill:var(--surface);font-weight:700}.fx-svg .t.acc{fill:var(--amber)}.fx-svg .red-t{fill:var(--bad)}.fx-svg .blue-t{fill:var(--blue)}.fx-svg .amb-t{fill:var(--amber)}
.fx-svg .mono-t{font-family:var(--f-mono);font-size:12px}
.fx-svg .arr line{stroke-width:3}.fx-svg .arr.red line{stroke:var(--bad)}.fx-svg .arr.red path{fill:var(--bad)}.fx-svg .arr.blue line{stroke:var(--blue)}.fx-svg .arr.blue path{fill:var(--blue)}
.fx-svg .flow{fill:none;stroke:var(--amber);stroke-width:3;stroke-dasharray:6 9}
.fx-svg .flow.up{stroke:var(--blue)}
.fx-svg .flow.run{animation:flow 0.9s linear infinite}
.fx-svg .cuttings{fill:none;stroke:var(--oil);stroke-width:5;stroke-linecap:round;stroke-dasharray:0 18}
.fx-svg .cuttings.run{animation:cut 1.6s linear infinite}
.fx-svg .rotp{fill:none;stroke:var(--amber);stroke-width:3}.fx-svg .rotp-h{fill:var(--amber)}
.fx-svg #rot.run,.fx-svg .rotp.run{transform-box:fill-box;transform-origin:center;animation:wob 1s ease-in-out infinite}
.fx-svg [data-s]{transition:opacity .5s}
.fx-svg .hide{opacity:0}
.fx-svg [data-reset],.fx-svg #bp,.fx-svg #arm,.fx-svg #bw{transition:transform 1.2s ease}
.fx-svg .diver{fill:var(--amber)}.fx-svg .gauge{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.fx-svg .needle{stroke:var(--bad);stroke-width:3;stroke-linecap:round;transform-box:view-box;transition:transform .5s}
.fx-svg .needle-hub{fill:var(--ink)}
.fx-svg #needle,.fx-svg #bn{transform-origin:center bottom;transform-box:fill-box}
.fx-svg #hs-n{transform-origin:225px 250px}.fx-svg #hk-n{transform-origin:140px 130px}
.fx-svg .jug{fill:var(--surface);stroke:var(--ink);stroke-width:2}.fx-svg .bucket{fill:none;stroke:var(--ink);stroke-width:3}
.fx-svg .skin{fill:var(--skin)}.fx-svg .callout{fill:var(--amber-soft);stroke:var(--amber)}
.fx-svg .gasb{fill:var(--gas);stroke:var(--bad);stroke-width:2;transition:transform 2.5s ease-in}
.fx-svg .bubble{fill:var(--gas);stroke:var(--bad);stroke-width:1.5;animation:rise 2.4s linear infinite}
