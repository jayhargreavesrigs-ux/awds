name: Publish Axis website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the website
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Read GitHub Pages settings
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Install the pinned Academy client
        run: npm ci --ignore-scripts

      - name: Build the website
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          AWDS_SUPABASE_URL: ${{ vars.AWDS_SUPABASE_URL }}
          AWDS_SUPABASE_PUBLIC_KEY: ${{ vars.AWDS_SUPABASE_PUBLIC_KEY }}
        run: node scripts/build-site.mjs

      - name: Check Academy course content and startup
        run: npm test

      - name: Upload the website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
